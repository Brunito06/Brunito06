name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 9 * * *" # todos los días, 6:00 de Montevideo
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#3F4FF0&color_dots=#ebedf0,#c9cdfb,#9aa2f7,#6b77f2,#3F4FF0
            dist/snake-dark.svg?palette=github-dark&color_snake=#4B5CF5&color_dots=#1f1f24,#262b5c,#33409a,#4352d4,#6b78ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
